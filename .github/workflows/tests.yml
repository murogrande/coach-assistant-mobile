name: tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libgles2-mesa-dev libgstreamer1.0-dev \
            libcairo2-dev pkg-config python3-dev \
            xvfb

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run pre-commit
        run: pre-commit run --all-files

      - name: Start virtual display
        run: Xvfb :99 -screen 0 1024x768x24 &

      - name: Run tests
        env:
          DISPLAY: ":99"
        run: python -m pytest tests/ -q

  compat:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # GitHub hosts no Windows 10 client runner.  windows-2022 (Server 2022,
        # build 20348) is the closest image — same Windows 10 kernel line —
        # while windows-latest currently resolves to Server 2025 (build 26100),
        # so both are covered.
        os: [windows-2022, windows-latest, macos-latest]
        # 3.10 is what Buildozer/python-for-android ships for the APK; 3.12
        # catches breakage for anyone running the desktop app on a newer Python.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        # Only install what test_api_client.py needs — no Kivy/KivyMD required.
        # Installing the full requirements.txt on Windows causes pip to compile
        # Kivy from source (no pre-built wheels), which hangs the runner.
        run: pip install requests pytest

      - name: Run tests
        # Screen tests require an OpenGL context (Xvfb on Linux).
        # Only run API-client tests here — they have no GUI dependency.
        run: python -m pytest tests/test_api_client.py -q
